name: Refresh profile

on:
  schedule:
    - cron: '23 22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', 'design/**', 'profile.config.json', 'package*.json', '.github/workflows/refresh-profile.yml']
  pull_request:
    paths: ['scripts/**', 'design/**', 'profile.config.json', 'package*.json', 'README.md', 'assets/**', 'data/**', '.github/workflows/refresh-profile.yml']

permissions:
  contents: read

concurrency:
  group: profile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run render && npm run check
      - name: Verify reproducible assets
        run: git diff --exit-code -- README.md assets/

  refresh:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run refresh && npm run check
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Commit refreshed profile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md assets/ data/github-profile.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore(profile): refresh contribution graphics'
          git push
